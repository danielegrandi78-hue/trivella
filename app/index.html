<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone e iPad: "Aggiungi a Home" apre il gioco a schermo intero come un'app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trivella">
<meta name="theme-color" content="#03040a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Trivella</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #03040a; overflow: hidden; cursor: none;
    position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* area di gioco: tutto lo schermo meno tacca, angoli arrotondati e barra Home */
  #stage {
    position: fixed;
    top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
  }
  canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); touch-action: none; }
  /* telefono o tablet tenuto in verticale */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 5; background: #03040a; color: #ffb868;
    font: 600 18px Bahnschrift, "Segoe UI", system-ui, sans-serif; letter-spacing: 3px; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px;
  }
  #rotate svg { width: 96px; height: 96px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="rotate">
  <svg viewBox="0 0 96 96" fill="none" stroke="#ffb868" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="14" y="40" width="68" height="38" rx="7"/>
    <path d="M30 26a26 26 0 0 1 40 0"/><path d="M70 14v12H58"/>
  </svg>
  <div>RUOTA IL DISPOSITIVO<br>IN ORIZZONTALE</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
